<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tchat — ChatNow</title>
<link rel="stylesheet" href="/css/style.css?v=2">
<script src="/js/theme.js?v=2"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💬</text></svg>">
</head>
<body class="page-chat">

<div class="net" id="net" hidden><span class="spin"></span> <b id="netText">Connexion perdue — reconnexion en cours…</b></div>

<div class="app">

  <!-- colonne gauche : salons -->
  <aside class="col rooms" id="colRooms">
    <div class="col-head">
      <a class="logo small" href="/"><span class="logo-mark">💬</span> ChatNow</a>
      <button class="ghost only-mobile" id="closeRooms" type="button" aria-label="Fermer">✕</button>
    </div>
    <div class="scroll" id="roomList"></div>
    <div class="col-foot">
      <span class="dot-live"><i></i><b id="online">0</b> en ligne</span>
      <button class="ghost" id="theme" type="button" title="Thème clair / sombre">🌙</button>
    </div>
  </aside>

  <!-- centre : conversation -->
  <section class="col main">
    <header class="bar">
      <button class="ghost only-mobile" id="openRooms" type="button" aria-label="Salons">☰</button>
      <div class="bar-title">
        <strong id="roomName">…</strong>
        <small id="roomDesc"></small>
      </div>
      <div class="tabs" id="tabs"></div>
      <button class="ghost only-mobile" id="openUsers" type="button" aria-label="Connectés">👥</button>
    </header>

    <!-- barre des salons audio / radio, masquée dans les salons texte -->
    <div class="audio-bar" id="audioBar" hidden></div>
    <div class="voix" id="voix" hidden></div>

    <div class="messages" id="messages" aria-live="polite"></div>

    <div class="typing" id="typing"></div>

    <form class="composer" id="composer" autocomplete="off">
      <button class="ghost" id="emojiBtn" type="button" aria-label="Emojis">🙂</button>
      <input id="input" maxlength="500" placeholder="Votre message…" autocomplete="off">
      <button class="btn send" type="submit" aria-label="Envoyer">➤</button>
      <div class="emoji-pop" id="emojiPop" hidden></div>
    </form>
    <p class="notice" id="notice" hidden></p>
  </section>

  <!-- colonne droite : connectés -->
  <aside class="col users" id="colUsers">
    <div class="col-head">
      <strong>Connectés <span class="pill" id="userCount">0</span></strong>
      <button class="ghost only-mobile" id="closeUsers" type="button" aria-label="Fermer">✕</button>
    </div>
    <div class="scroll" id="userList"></div>
    <div class="col-foot me" id="me"></div>
  </aside>
</div>

<!-- fiche d'un participant -->
<div class="modal" id="card" hidden>
  <div class="modal-box">
    <button class="ghost close" id="cardClose" type="button">✕</button>
    <div class="card-id"><span class="avatar big" id="cardAvatar"></span>
      <div><strong id="cardPseudo"></strong><small id="cardMeta"></small></div></div>
    <div class="card-actions">
      <button class="btn" id="cardPm" type="button">✉️ Message privé</button>
      <button class="btn light" id="cardIgnore" type="button">🙈 Ignorer</button>
      <button class="btn light danger" id="cardReport" type="button">🚩 Signaler</button>
    </div>
  </div>
</div>

<!-- signalement -->
<div class="modal" id="rep" hidden>
  <form class="modal-box" id="repForm">
    <button class="ghost close" id="repClose" type="button">✕</button>
    <h2>Signaler <span id="repWho"></span></h2>
    <label>Motif
      <select id="repReason">
        <option>Insultes ou harcèlement</option>
        <option>Contenu à caractère sexuel</option>
        <option>Racisme, haine, discrimination</option>
        <option>Spam ou publicité</option>
        <option>Personne mineure / comportement inquiétant</option>
        <option>Autre</option>
      </select>
    </label>
    <label>Précisions <span class="opt">(facultatif)</span>
      <textarea id="repNote" maxlength="500" rows="3"></textarea>
    </label>
    <button class="btn danger" type="submit">Envoyer le signalement</button>
    <p class="fine">Le signalement est transmis à la modération avec les derniers messages de la personne.</p>
  </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/voix.js?v=2"></script>
<script src="/js/chat.js?v=2"></script>
</body>
</html>
